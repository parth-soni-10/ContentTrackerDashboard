# The one config this site has: its Cloudflare Pages project.
#
#   npx wrangler pages dev .           → local test on http://localhost:8788
#   npx wrangler pages deploy          → publish .pages-dist to the project
#
# There is no Worker config and no Worker. The function half of the site - every
# path under /.netlify/functions/ - is a Pages Function: `functions/[[path]].js`
# catches every request and hands it to `functions/_router.js`, which routes it
# to the module under netlify/functions/ that answers it. Pages compiles those
# files as part of the deploy, so nothing is bundled here and `wrangler deploy`
# is not a command this repository has any use for.
#
# `pages_build_output_dir` names the upload that tools/deploy-pages.mjs stages
# from this repository (the repository root, minus `.assetsignore`). The admin
# secrets (ADMIN_PASSWORD, ADMIN_SESSION_SECRET, the TMDB/OMDb keys) are set on
# the project and are in no file here.

name = "contenttrackerdashboard"
pages_build_output_dir = ".pages-dist"
compatibility_date = "2026-10-01"

# lib/session.js and admin-login.js sign the admin cookie with node:crypto's
# createHmac/timingSafeEqual over Buffers, and the D1 store and importers use
# Buffer too. Pages compiles functions/ with this flag, so those builtins are
# left as `node:` externals in the deployment.
compatibility_flags = ["nodejs_compat"]

# The watchlist store: one D1 database, one row per title, and the only copy.
# The schema is a committed migration in migrations/ - wrangler's own default
# directory - applied with:
#   npx wrangler d1 migrations apply content-tracker-watchlist --local
# D1 does not run migrations on deploy, so that command is part of releasing a
# schema change.
[[d1_databases]]
binding = "DB"
database_name = "content-tracker-watchlist"
database_id = "c5c4e1f6-6f5e-4c0b-955d-b0e2d6b27826"

# The shared feedback namespace. /api/feedback answers 503 until this binding
# exists, and that is deliberate: a route that silently accepted feedback it
# could not store would read as a working form and lose every message.
#
# Provisioned once, shared by every site in this collection, then bound here:
#   npx wrangler kv namespace create site-feedback
# and uncomment the block below with the id it returns. No id is committed
# before it exists - a placeholder id fails the deploy instead of the binding.
# [[kv_namespaces]]
# binding = "SITE_FEEDBACK"
# id = "<id from wrangler kv namespace create site-feedback>"
