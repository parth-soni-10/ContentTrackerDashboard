name: Check

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No build step and no build script — package.json carries no
      # dependencies at all — so "does it still parse" is the whole of a static
      # check. The Pages Function is checked too: Pages compiles functions/ at
      # deploy time, and a syntax error there is a failed deploy rather than a
      # failing test.
      - name: Syntax-check the app, the function and the endpoints
        run: |
          set -e
          node --check app.js
          for f in functions/*.js netlify/functions/*.js netlify/functions/lib/*.js; do
            node --check "$f"
          done
