name: Check

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No build step, no package.json: the repo root IS the publish directory,
      # so "does it still parse" is the whole of a static check.
      - name: Syntax-check the app and every function
        run: |
          set -e
          node --check app.js
          for f in netlify/functions/*.js netlify/functions/lib/*.js; do
            node --check "$f"
          done
