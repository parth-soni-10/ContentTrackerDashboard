<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | Content Tracker</title>
<meta name="robots" content="noindex" />
<!--
  Why this file exists rather than being left to the platform: with no 404.html in
  the upload, Pages answers `200` with index.html for every unmatched path, so a
  path that serves nothing looks like a page that does. Until this file, an
  unknown path got Cloudflare's generic 509-byte error instead of the dashboard's own.

  No inline style and no script: the CSP here is `style-src 'self'` with no
  'unsafe-inline', so a <style> block would be dropped. The sheet below is the same
  origin, which the policy already allows.
-->
<link rel="stylesheet" href="/404.css" />
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Nothing at this address</h1>
  <p>That page is not part of the tracker. <a href="/">Back to the dashboard</a>.</p>
</main>
</body>
</html>
